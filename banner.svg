<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9FF">
        <animate attributeName="stop-color" values="#00C9FF;#92FE9D;#00C9FF" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#92FE9D">
        <animate attributeName="stop-color" values="#92FE9D;#00C9FF;#92FE9D" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="150" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1" />
  
  <g filter="url(#glow)">
    <text x="50%" y="68px" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">
      SISTEMA DE TRIAGEM CLÍNICA
    </text>
  </g>
  <text x="50%" y="103px" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#8b949e" text-anchor="middle" letter-spacing="1.5">
    Protocolo de Manchester • Classificação de Risco e Gestão de Fila em Tempo Real
  </text>

  <!-- Continuous moving heartbeat -->
  <g opacity="0.4">
    <path d="M 0,135 L 350,135 L 360,115 L 375,150 L 390,105 L 405,150 L 420,135 L 800,135" 
          fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <path d="M 0,135 L 350,135 L 360,115 L 375,150 L 390,105 L 405,150 L 420,135 L 800,135" 
        fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="150 800">
    <animate attributeName="stroke-dashoffset" values="800;-150" dur="2s" repeatCount="indefinite" />
  </path>
</svg>
